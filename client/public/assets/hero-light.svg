<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <radialGradient id="orbBlue" cx="20%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#E0E7FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbIndigo" cx="82%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#DBEAFE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#F1F5F9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="lightGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="48" cy="48" r="1.2" fill="#94A3B8" fill-opacity="0.35" />
    </pattern>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Base Light Canvas -->
  <rect width="1920" height="1080" fill="url(#bgBase)" />

  <!-- Luminous Light Orbs -->
  <rect width="1920" height="1080" fill="url(#orbBlue)" />
  <rect width="1920" height="1080" fill="url(#orbIndigo)" />
  <rect width="1920" height="1080" fill="url(#orbCyan)" />

  <!-- Architectural Perspective Grid -->
  <rect width="1920" height="1080" fill="url(#lightGrid)" />

  <!-- Subtle Geometric AI Node Waves -->
  <g stroke="#3B82F6" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <path d="M-100,260 C360,120 720,420 1220,240 C1560,110 1820,290 2020,190" />
    <path d="M-100,640 C420,510 860,790 1380,580 C1660,470 1840,630 2020,540" />
    <path d="M-100,880 C480,740 940,960 1480,810 C1720,740 1880,860 2020,790" />
  </g>

  <!-- Decorative Floating Light Dashboard Cards in Background -->
  <g transform="translate(110, 150) rotate(-4)">
    <rect width="320" height="190" rx="24" fill="url(#cardGlass)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="24" y="26" width="90" height="12" rx="6" fill="#BFDBFE" />
    <rect x="24" y="52" width="210" height="10" rx="5" fill="#E2E8F0" />
    <rect x="24" y="72" width="170" height="10" rx="5" fill="#E2E8F0" />
    <rect x="24" y="110" width="272" height="52" rx="14" fill="#EFF6FF" stroke="#DBEAFE" />
  </g>

  <g transform="translate(1480, 170) rotate(5)">
    <rect width="330" height="205" rx="24" fill="url(#cardGlass)" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="48" cy="46" r="18" fill="#DBEAFE" />
    <rect x="78" y="34" width="140" height="10" rx="5" fill="#93C5FD" />
    <rect x="78" y="52" width="100" height="8" rx="4" fill="#CBD5E1" />
    <rect x="28" y="88" width="274" height="86" rx="16" fill="#F8FAFC" stroke="#E2E8F0" />
  </g>
</svg>

